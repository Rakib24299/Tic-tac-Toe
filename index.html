<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe - Cyber Gaming</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        celebrate: {
                            '0%': { transform: 'scale(0.4) translateY(-20px)', opacity: '0' },
                            '60%': { transform: 'scale(1.06) translateY(0)', opacity: '1' },
                            '80%': { transform: 'scale(0.96)' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 15px rgba(250, 204, 21, 0.7))' },
                            '50%': { filter: 'drop-shadow(0 0 30px rgba(250, 204, 21, 1))' }
                        }
                    },
                    animation: {
                        celebrate: 'celebrate 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        glow: 'pulseGlow 2s ease-in-out infinite'
                    }
                }
            }
        }
    </script>
    <!-- Confetti Library for celebration effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-[#0b0f19] min-h-screen min-h-[100dvh] w-full flex flex-col items-center justify-center p-3 sm:p-6 font-sans text-center select-none overflow-x-hidden relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1e1b4b] via-[#0b0f19] to-[#030712]">

    <!-- Ambient Gaming Glow Orbs in Background -->
    <div class="fixed -top-32 -left-32 w-80 h-80 sm:w-96 sm:h-96 bg-purple-600/25 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="fixed -bottom-32 -right-32 w-80 h-80 sm:w-96 sm:h-96 bg-cyan-500/20 rounded-full blur-[100px] pointer-events-none"></div>

    <main class="w-full max-w-lg mx-auto flex flex-col items-center justify-center py-2 sm:py-4 relative z-10">
        
        <!-- Header Section -->
        <header class="w-full flex flex-col items-center mb-3 sm:mb-5">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-black tracking-widest uppercase flex items-center justify-center gap-2 sm:gap-3 drop-shadow-[0_0_25px_rgba(0,0,0,0.8)]">
                <span class="text-white drop-shadow-[0_2px_10px_rgba(255,255,255,0.3)]">TIC</span>
                <span class="text-cyan-400 drop-shadow-[0_0_25px_rgba(34,211,238,0.8)]">TAC</span>
                <span class="text-fuchsia-400 drop-shadow-[0_0_25px_rgba(232,121,249,0.8)]">TOE</span>
            </h1>

            <!-- Live Turn Indicator (Visible during play) -->
            <div id="turn-badge" class="mt-3 px-4 py-1.5 bg-slate-900/90 backdrop-blur-xl border border-slate-700/80 rounded-full shadow-[0_0_20px_rgba(0,0,0,0.6)] flex items-center gap-2 text-white font-semibold text-xs sm:text-sm tracking-wide transition-all">
                <span id="turn-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.9)] animate-pulse"></span>
                <span id="turn-text">Turn: <strong class="text-cyan-300 font-extrabold text-sm sm:text-base drop-shadow-[0_0_8px_rgba(34,211,238,0.7)]">Player O</strong></span>
            </div>
        </header>

        <!-- Winner / Draw Message Container (Shows on Game End) -->
        <div class="msgcontainer hidden flex-col items-center justify-center mb-3 sm:mb-5 w-full max-w-[min(90vw,340px)] sm:max-w-[390px] md:max-w-[440px] animate-celebrate">
            <div id="msgcard" class="w-full bg-amber-400/20 border-2 border-amber-300/80 backdrop-blur-xl rounded-2xl px-5 py-3 shadow-[0_0_35px_rgba(251,191,36,0.5)] flex items-center justify-center gap-3 animate-glow">
                <div id="msgicon1" class="flex items-center justify-center shrink-0"></div>
                <p id="massage" class="text-white text-base sm:text-xl md:text-2xl font-extrabold tracking-wide drop-shadow-md truncate">
                    Winner
                </p>
                <div id="msgicon2" class="flex items-center justify-center shrink-0"></div>
            </div>
        </div>

        <!-- Game Board Container -->
        <div class="cotainer flex justify-center items-center w-full my-1 sm:my-2"> 
            <div class="game grid grid-cols-3 gap-2.5 sm:gap-3.5 md:gap-4 p-3 sm:p-4 md:p-5 bg-slate-900/70 border border-slate-700/60 backdrop-blur-2xl rounded-2xl sm:rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] w-full max-w-[min(90vw,340px)] sm:max-w-[390px] md:max-w-[440px] aspect-square">
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
                <button class="box aspect-square w-full h-full bg-slate-800/90 hover:bg-slate-700/80 border border-slate-700/70 hover:border-cyan-400/50 rounded-xl sm:rounded-2xl text-4xl sm:text-6xl md:text-7xl font-black shadow-lg hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] hover:scale-[1.03] active:scale-95 transition-all duration-150 flex items-center justify-center cursor-pointer touch-manipulation"></button>
            </div>
        </div>

        <!-- Action Buttons side-by-side: Reset and New Game -->
        <div class="flex items-center justify-center gap-3 sm:gap-4 mt-4 sm:mt-6 w-full max-w-[min(90vw,340px)] sm:max-w-[390px] md:max-w-[440px]">
            <button class="resetbtn flex-1 sm:flex-initial bg-gradient-to-r from-slate-800 to-slate-700 hover:from-slate-700 hover:to-slate-600 border border-slate-600/70 text-slate-200 hover:text-white font-bold text-sm sm:text-base md:text-lg px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl sm:rounded-2xl shadow-lg hover:shadow-cyan-500/20 active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center gap-1.5 sm:gap-2 touch-manipulation">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>Reset</span>
            </button>
            <button class="newgamebtn flex-1 sm:flex-initial bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm sm:text-base md:text-lg px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl sm:rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_28px_rgba(6,182,212,0.6)] active:scale-95 transition-all duration-200 cursor-pointer flex items-center justify-center gap-1.5 sm:gap-2 touch-manipulation">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>New Game</span>
            </button>
        </div>
    </main>
    
    <script src="index.js"></script>
</body>
</html>
